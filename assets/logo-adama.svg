<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="60" height="60" role="img" aria-label="Adama City Administration emblem">
  <defs>
    <linearGradient id="admRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E7A4C"/>
      <stop offset="100%" stop-color="#0F5C39"/>
    </linearGradient>
    <linearGradient id="admGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#D9A62A"/>
    </linearGradient>
    <linearGradient id="admSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF6EF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <path id="admTopArc" d="M 16 62 A 44 44 0 0 1 104 62"/>
    <path id="admBotArc" d="M 20 78 A 40 40 0 0 0 100 78"/>
  </defs>

  <!-- outer ring -->
  <circle cx="60" cy="60" r="58" fill="url(#admRing)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#admGold)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="49" fill="url(#admSky)"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#0F5C39" stroke-width="1.5" opacity="0.35"/>

  <!-- sunburst -->
  <g opacity="0.9">
    <circle cx="60" cy="46" r="9" fill="url(#admGold)"/>
    <g stroke="url(#admGold)" stroke-width="2.4" stroke-linecap="round">
      <line x1="60" y1="26" x2="60" y2="32"/>
      <line x1="44" y1="32" x2="48" y2="36"/>
      <line x1="76" y1="32" x2="72" y2="36"/>
      <line x1="38" y1="46" x2="44" y2="46"/>
      <line x1="82" y1="46" x2="76" y2="46"/>
    </g>
  </g>

  <!-- skyline: civic buildings -->
  <g fill="#0F5C39">
    <rect x="30" y="66" width="10" height="24" rx="1"/>
    <rect x="42" y="58" width="12" height="32" rx="1"/>
    <rect x="56" y="64" width="9" height="26" rx="1"/>
    <rect x="67" y="52" width="13" height="38" rx="1"/>
    <rect x="82" y="68" width="9" height="22" rx="1"/>
    <rect x="70.5" y="45" width="2.5" height="8"/>
    <circle cx="71.7" cy="43" r="2" fill="url(#admGold)"/>
  </g>
  <rect x="26" y="90" width="68" height="4" rx="1.5" fill="url(#admGold)"/>

  <!-- text ring -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#0F5C39">
    <textPath href="#admTopArc" startOffset="50%" text-anchor="middle">ADAMA</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="700" letter-spacing="1.4" fill="#0F5C39">
    <textPath href="#admBotArc" startOffset="50%" text-anchor="middle">CITY ADMINISTRATION</textPath>
  </text>
</svg>
